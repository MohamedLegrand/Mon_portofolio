# Intégration continue : vérifie que le code est propre et que le site compile
# à chaque push et à chaque pull request sur main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Annule une exécution en cours si un nouveau push arrive sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint et build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code (ESLint)
        run: npm run lint

      - name: Compiler le site (TypeScript + Vite)
        run: npm run build
        env:
          # Variable de dépôt (Settings > Secrets and variables > Actions > Variables).
          VITE_FORMSPREE_FORM_ID: ${{ vars.VITE_FORMSPREE_FORM_ID }}

      - name: Conserver le site compilé
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
